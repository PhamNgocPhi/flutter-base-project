include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - unawaited_futures
    - directives_ordering
